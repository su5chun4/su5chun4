
name: Build Photo Organizer AI

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: PhotoOrganizerAI-Windows
          - os: macos-latest
            artifact: PhotoOrganizerAI-Mac

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build application
        run: >
          pyinstaller --noconfirm --clean
          --windowed --name PhotoOrganizerAI app.py

      - name: Upload Windows executable
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: PhotoOrganizerAI-Windows
          path: dist/PhotoOrganizerAI/

      - name: Upload Mac application
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: PhotoOrganizerAI-Mac
          path: dist/PhotoOrganizerAI.app/
